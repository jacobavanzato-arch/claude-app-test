<style>
  .lost {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    position: relative;
    isolation: isolate;
    padding: 4rem 0;
  }
  .lost__bg { position: absolute; inset: 0; z-index: -1; }
  .lost__bg img { width: 100%; height: 100%; object-fit: cover; }
  .lost__bg::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,9,15,0.88), rgba(7,9,15,0.72) 45%, var(--ink));
  }
  .lost h1 {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(2.4rem, 1.6rem + 3.4vw, 4rem);
    line-height: 1.05;
    margin: 0 0 1.2rem;
  }
  .lost p { max-width: 34rem; margin-inline: auto; }
  .lost .btn { margin-top: 1.5rem; }
</style>
</head>
<body>
<main class="lost">
  <div class="lost__bg" aria-hidden="true">
    <img src="assets/img/night-village.jpg" alt="" decoding="async">
  </div>
  <div class="wrap">
    <p class="eyebrow">Vatulele Island · Fiji</p>
    <h1>This page is<br>somewhere off the reef</h1>
    <p class="lead">
      The page you were looking for is not here. The island still is — three
      all-inclusive retreats, November and December 2026, a hundred places each.
    </p>
    <p>
      <a class="btn btn--gold" href="/">Back to Lomanikaya</a>
    </p>
    <p class="note">Or call +679 927 2354 (Fiji) · +1 310 980 8276 (USA)</p>
  </div>
</main>
</body>
