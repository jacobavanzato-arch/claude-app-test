<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lomanikaya">
  <!--
    PLACEHOLDER MARK — a plain sun-over-water roundel standing in for the
    resort's gold emblem. Replace this file with the official logo (SVG
    preferred, or swap the <img src> in index.html to a PNG) at the same
    small size; the header is designed around a ~34px mark.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ce84"/>
      <stop offset="0.55" stop-color="#d9ae5f"/>
      <stop offset="1" stop-color="#a97f36"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30.2" fill="none" stroke="url(#g)" stroke-width="1.5"/>

  <!-- sun -->
  <circle cx="32" cy="28.5" r="8.6" fill="url(#g)"/>
  <g stroke="url(#g)" stroke-width="1.6" stroke-linecap="round">
    <path d="M32 12.4v-3.6M32 47.4v0"/>
    <path d="M45.4 15.1l2.5-2.5M18.6 15.1l-2.5-2.5"/>
    <path d="M50.9 28.5h3.6M13.1 28.5H9.5"/>
  </g>

  <!-- horizon and water -->
  <path d="M9.5 40.5h45" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M13 46.6c3.2-2.4 6.3-2.4 9.5 0s6.3 2.4 9.5 0 6.3-2.4 9.5 0 6.3 2.4 9.5 0"
        fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 53.4c3.2-2.4 6.3-2.4 9.5 0s6.3 2.4 9.5 0 6.3-2.4 9.5 0"
        fill="none" stroke="url(#g)" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
</svg>
